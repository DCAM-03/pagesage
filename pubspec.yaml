name: pagesage
description: "A local-first intelligent reader for EPUB and PDF."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  drift: ^2.34.0
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_markdown: ^0.7.7+1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  logger: ^2.7.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf_document: ^1.2.3
  pdf_graphics: ^1.0.0
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.5.3
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/renderer/pdf/
    - assets/images/brand/
    - assets/images/empty-states/
    - assets/images/covers/
    - assets/images/store/
  fonts:
    - family: LXGW WenKai Lite
      fonts:
        - asset: assets/fonts/LXGWWenKaiLite-Regular.ttf
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
