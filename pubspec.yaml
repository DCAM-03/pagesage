name: pagesage
description: "A local-first intelligent reader for EPUB, PDF, and Markdown."
publish_to: 'none'
version: 0.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  dart_pdf_editor: ^5.1.1
  drift: ^2.34.0
  file_picker: ^12.3.0
  flutter:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  flutter_markdown: ^0.7.7+1
  # The Markdown reader parses with the same parser flutter_markdown uses;
  # declaring it directly keeps the reader from depending on another
  # package's dependency list.
  markdown: ^7.3.1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  go_router: ^17.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3: ^3.5.2
  pdf_cos: ^5.1.1
  pdf_document: ^5.1.1
  pdf_graphics: ^5.1.1
  # Opening a PDF's /URI links in the user's browser. It was already in the
  # tree as a transitive dependency of dart_pdf_editor, so the platform
  # plugins (android/linux/web/windows) are registered either way; declaring it
  # here makes the direct import legal and pins the version we call.
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  xml: ^6.6.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0
  path_provider_platform_interface: ^2.1.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  licenses:
    - NOTICE
    - assets/fonts/licenses/LXGWWenKaiLite-OFL.txt
    - assets/fonts/licenses/AtkinsonHyperlegible-OFL.txt
    - assets/licenses/archive-LICENSE-other.txt
  assets:
    - assets/images/brand/
    - assets/images/empty-states/
    - assets/images/covers/
    - assets/images/store/
  fonts:
    - family: LXGW WenKai Lite
      fonts:
        - asset: assets/fonts/LXGWWenKaiLite-Regular.ttf
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf

hooks:
  user_defines:
    sqlite3:
      source: sqlite3
