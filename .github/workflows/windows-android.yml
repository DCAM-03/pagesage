name: Windows and Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: "3.44.2"
  FLUTTER_REVISION: c9a6c484230f8b5e408ec57be1ef71dee1e77020

jobs:
  windows:
    name: Test and package Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
        with:
          platform: windows
      - name: Resolve locked dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          flutter pub get --enforce-lockfile
          Push-Location poc_pdf_canvas
          try { flutter pub get --enforce-lockfile } finally { Pop-Location }
      - name: Analyze and test distribution tooling
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          flutter analyze --no-pub
          python -m unittest discover -s test/tool -p '*_test.py' -v
      - name: Run default component tests
        run: flutter test --no-pub --concurrency=4 --reporter expanded
      - name: Build release
        run: flutter build windows --release
      - name: Test native PDF handlers without a window
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S test/native -B build/native-tests -A x64
          cmake --build build/native-tests --config Release --parallel 4
          # Hosted Windows Server images do not guarantee an OCR language pack.
          # Actual OCR recognition remains a separate device acceptance check.
          ctest --test-dir build/native-tests -C Release --output-on-failure -E windows_ocr
      - name: Package complete Windows bundle and verify checksums
        run: python tool/package_platform.py windows
      - name: Upload Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pagesage-windows-x86_64-${{ github.sha }}
          path: |
            dist/*-windows-x86_64.zip
            dist/*-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload native diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-native-diagnostics-${{ github.sha }}
          path: build/native-tests/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Test Android API 36 and package release
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Reserve space for Android emulator and Gradle
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          # Hosted images contain .NET and other NDK versions this job never uses.
          sudo rm -rf -- /usr/share/dotnet
          for ndk_dir in "$ANDROID_HOME"/ndk/*; do
            if [[ -d "$ndk_dir" && "${ndk_dir##*/}" != 28.2.13676358 ]]; then
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --uninstall "ndk;${ndk_dir##*/}"
            fi
          done
          df -h "$RUNNER_TEMP"
      - uses: ./.github/actions/setup-flutter
        with:
          platform: android
      - name: Install SDK and isolated emulator
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses > "$RUNNER_TEMP/android-licenses.log"
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" = 0
          "$sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' \
            'ndk;28.2.13676358' 'emulator' 'platform-tools' \
            'system-images;android-36;google_apis;x86_64'
          echo 'no' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name pagesage-ci --package 'system-images;android-36;google_apis;x86_64'
          # API 36 may enforce 6 GB userdata even when a smaller size is requested.
          # Reserve its startup disk requirement plus room for Gradle and packages.
          available_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')"
          if (( available_kb < 12 * 1024 * 1024 )); then
            df -h "$RUNNER_TEMP"
            echo 'Android CI requires at least 12 GiB free for userdata and Gradle outputs' >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          (cd poc_pdf_canvas && flutter pub get --enforce-lockfile)
      - name: Analyze and test distribution tooling
        run: |
          set -euo pipefail
          flutter analyze --no-pub
          python3 -m unittest discover -s test/tool -p '*_test.py' -v
          shellcheck tool/publish_draft_release.sh
      - name: Run Android integration tests without a window
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/emulator/emulator" -avd pagesage-ci -port 5554 \
            -no-window -no-audio -no-snapshot -gpu swiftshader -no-boot-anim \
            -no-metrics -camera-back none -camera-front none \
            > "$RUNNER_TEMP/pagesage-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb -s emulator-5554 emu kill >/dev/null 2>&1 || true; kill "$emulator_pid" 2>/dev/null || true' EXIT
          booted=false
          for _attempt in {1..120}; do
            if [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
              booted=true
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ "$booted" != true ]]; then tail -80 "$RUNNER_TEMP/pagesage-emulator.log"; exit 1; fi
          adb -s emulator-5554 shell input keyevent 82
          flutter test integration_test/android_platform_test.dart -d emulator-5554 --reporter expanded
      - name: Prepare signing for trusted builds
        id: signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          keys = ('ANDROID_KEYSTORE_BASE64', 'ANDROID_STORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD')
          present = [bool(os.environ.get(key)) for key in keys]
          required = os.environ['GITHUB_REF'].startswith('refs/tags/v')
          if (any(present) and not all(present)) or (required and not all(present)):
              raise SystemExit('Configure all four Android signing Secrets; version tags require release signing')
          if all(present):
              path = Path(os.environ['RUNNER_TEMP']) / 'pagesage-signing.jks'
              path.write_bytes(base64.b64decode(os.environ[keys[0]], validate=True))
              path.chmod(0o600)
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write(f'PAGESAGE_ANDROID_KEYSTORE_PATH={path}\n')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('signed=true\n')
          PY
      - name: Build and verify ordinary app outputs
        env:
          PAGESAGE_ANDROID_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_STORE_PASSWORD || '' }}
          PAGESAGE_ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          PAGESAGE_ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
          PAGESAGE_REQUIRE_RELEASE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          # Regenerate plugin registration after integration_test; do not use --no-pub.
          flutter build apk --release
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/apk-certificate.txt"
          if [[ "$SIGNED" == true ]]; then
            if grep -Fq 'CN=Android Debug' "$RUNNER_TEMP/apk-certificate.txt"; then
              echo 'Refusing debug certificate for a signed distribution' >&2; exit 1
            fi
            flutter build appbundle --release
            jarsigner -J-Duser.language=en -verify build/app/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/aab-signature.txt"
            grep -Fq 'jar verified.' "$RUNNER_TEMP/aab-signature.txt"
            python3 tool/package_platform.py android --signed --aab build/app/outputs/bundle/release/app-release.aab
          else
            python3 tool/package_platform.py android
          fi
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pagesage-signing.jks"
      - name: Upload Android packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pagesage-android-${{ github.sha }}
          path: |
            dist/*.apk
            dist/*.aab
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-emulator-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/pagesage-emulator.log
          if-no-files-found: ignore
          retention-days: 7

  draft-release:
    name: Attach Windows and signed Android packages to draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    concurrency:
      group: draft-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pagesage-windows-x86_64-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pagesage-android-${{ github.sha }}
          path: dist
      - name: Verify downloaded checksums
        run: python3 tool/package_platform.py verify
      - name: Attach to draft without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash tool/publish_draft_release.sh "$RELEASE_TAG" dist/*.zip dist/*.apk dist/*.aab dist/*.sha256
