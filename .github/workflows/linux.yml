name: Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: "3.44.2"
  FLUTTER_REVISION: c9a6c484230f8b5e408ec57be1ef71dee1e77020
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  build:
    name: Test and package Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v${version%%+*}" && "$GITHUB_REF_NAME" != "v$version" ]]; then
              printf 'Tag %s does not match pubspec version %s\n' "$GITHUB_REF_NAME" "$version" >&2
              exit 1
            fi
          fi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev \
            libstdc++-12-dev shellcheck

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/flutter"
          git init "$sdk_dir"
          git -C "$sdk_dir" remote add origin https://github.com/flutter/flutter.git
          git -C "$sdk_dir" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$sdk_dir" checkout --detach "refs/tags/$FLUTTER_VERSION"
          test "$(git -C "$sdk_dir" rev-parse HEAD)" = "$FLUTTER_REVISION"
          test "$(git -C "$sdk_dir" describe --tags --exact-match HEAD)" = "$FLUTTER_VERSION"
          printf '%s\n' "$sdk_dir/bin" >> "$GITHUB_PATH"
          "$sdk_dir/bin/flutter" --version
          "$sdk_dir/bin/flutter" --version --machine > "$RUNNER_TEMP/flutter-version.json"
          python3 - "$RUNNER_TEMP/flutter-version.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as version_file:
              version = json.load(version_file)
          expected = {
              "frameworkVersion": os.environ["FLUTTER_VERSION"],
              "frameworkRevision": os.environ["FLUTTER_REVISION"],
          }
          for field, value in expected.items():
              if version.get(field) != value:
                  raise SystemExit(f"Flutter {field}: expected {value}, got {version.get(field)}")
          print(f"Verified Flutter {version['frameworkVersion']} at {version['frameworkRevision']}")
          PY
          "$sdk_dir/bin/flutter" precache --linux

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Resolve PDF sample project dependencies
        working-directory: poc_pdf_canvas
        run: flutter pub get --enforce-lockfile

      - name: Check release scripts
        run: |
          shellcheck tool/build_linux_release.sh tool/package_linux.sh \
            tool/linux_bundle_install.sh tool/linux_launcher.sh
          dart format --output=none --set-exit-if-changed test/tool/linux_distribution_test.dart

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run complete default test suite
        run: flutter test --no-pub --concurrency=4 --reporter expanded

      - name: Build and package
        run: bash tool/build_linux_release.sh

      - name: Check Linux runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(pwd)/build/linux/x64/release/bundle"
          export LD_LIBRARY_PATH="$bundle/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ldd "$bundle/pagesage" > "$RUNNER_TEMP/pagesage-ldd.txt"
          if grep -Fq 'not found' "$RUNNER_TEMP/pagesage-ldd.txt"; then
            cat "$RUNNER_TEMP/pagesage-ldd.txt"
            exit 1
          fi
          while IFS= read -r -d '' library; do
            readelf -d "$library" > "$RUNNER_TEMP/pagesage-library-elf.txt"
            if grep -Fq 'Shared library: [libjvm.so]' "$RUNNER_TEMP/pagesage-library-elf.txt"; then
              printf 'Unexpected Java runtime dependency: %s\n' "$library" >&2
              exit 1
            fi
            ldd "$library" > "$RUNNER_TEMP/pagesage-library-ldd.txt"
            if grep -Fq 'not found' "$RUNNER_TEMP/pagesage-library-ldd.txt"; then
              printf 'Missing runtime dependencies: %s\n' "$library" >&2
              cat "$RUNNER_TEMP/pagesage-library-ldd.txt"
              exit 1
            fi
          done < <(find "$bundle/lib" -maxdepth 1 -type f -name '*.so' -print0)

      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check ./*.sha256

      - name: Upload Linux package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pagesage-linux-x86_64-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  draft-release:
    name: Attach Linux package to draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pagesage-linux-x86_64-${{ github.sha }}
          path: dist

      - name: Verify downloaded checksums
        working-directory: dist
        run: sha256sum --check ./*.sha256

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=(--draft --verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${release_flags[@]}" \
            dist/*.tar.gz dist/*.tar.gz.sha256
