<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>PageSage PDF Renderer</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header id="toolbar" aria-label="PDF 工具栏">
      <button id="prev" type="button" aria-label="上一页">&lt;</button>
      <span id="pageLabel">-</span>
      <button id="next" type="button" aria-label="下一页">&gt;</button>
      <select id="zoomPreset" aria-label="缩放方式">
        <option value="fit-width">适合宽度</option>
        <option value="fit-page">适合页面</option>
        <option value="actual">实际大小</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="custom">自定义</option>
      </select>
      <select id="displayMode" aria-label="显示模式">
        <option value="continuous">连续滚动</option>
        <option value="single">单页</option>
        <option value="double">双页</option>
      </select>
      <button id="zoomOut" type="button" aria-label="缩小">-</button>
      <button id="zoomIn" type="button" aria-label="放大">+</button>
    </header>
    <main id="stage">
    </main>
    <div id="textLayerStatus" role="status" hidden>
      此 PDF 没有可选择文本
    </div>
    <script src="pdf.min.js"></script>
    <script src="bridge.js"></script>
  </body>
</html>
